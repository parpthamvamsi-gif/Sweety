<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.W.E.E.T.Y - AI Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080810;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .app-card {
            width: 100%;
            max-width: 420px;
            background: #12121e;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(255, 0, 127, 0.25);
            border: 1px solid rgba(255, 0, 127, 0.4);
            text-align: center;
        }
        h1 { color: #ff007f; font-size: 24px; letter-spacing: 3px; margin-bottom: 5px; }
        .status-text { font-size: 13px; color: #00ffcc; margin-bottom: 25px; font-weight: 600; }
        
        .avatar-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-core {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff007f 0%, #7900ff 100%);
            box-shadow: 0 0 30px #ff007f;
            transition: all 0.4s ease;
        }
        .avatar-ring {
            position: absolute;
            width: 125px;
            height: 125px;
            border-radius: 50%;
            border: 2px dashed #00ffcc;
            animation: rotate 10s linear infinite;
            opacity: 0.6;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .listening .avatar-core { background: radial-gradient(circle, #00ffcc 0%, #0088ff 100%); box-shadow: 0 0 45px #00ffcc; transform: scale(1.15); }
        .thinking .avatar-core { background: radial-gradient(circle, #ffcc00 0%, #ff5500 100%); box-shadow: 0 0 45px #ffcc00; animation: pulse 0.8s infinite alternate; }
        .speaking .avatar-core { background: radial-gradient(circle, #ff007f 0%, #ff00ff 100%); box-shadow: 0 0 50px #ff00ff; animation: speakPulse 0.4s infinite alternate; }
        
        @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }
        @keyframes speakPulse { 0% { transform: scale(1); } 100% { transform: scale(1.2); } }

        input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #2a2a3d;
            background: #080810;
            color: #fff;
            margin-bottom: 12px;
            font-size: 13px;
        }
        textarea { height: 70px; resize: none; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 12px; border: none; border-radius: 12px;
            font-weight: bold; color: #fff; background: #ff007f; cursor: pointer;
        }
        button.mic-btn { background: #0088ff; }
        .chat-box {
            background: #080810; border-radius: 12px; padding: 15px;
            text-align: left; font-size: 14px; min-height: 50px; border-left: 3px solid #ff007f;
        }
    </style>
</head>
<body>

<div class="app-card">
    <h1>S.W.E.E.T.Y</h1>
    <div class="status-text" id="status">STATUS: READY</div>

    <div class="avatar-container" id="avatarContainer">
        <div class="avatar-ring"></div>
        <div class="avatar-core"></div>
    </div>

    <input type="password" id="apiKey" placeholder="Paste Gemini API Key" oninput="saveApiKey()">
    <textarea id="prompt" placeholder="Type or click Speak..."></textarea>

    <div class="controls">
        <button class="mic-btn" id="micBtn" onclick="startSpeech()">🎤 SPEAK</button>
        <button onclick="askSweety()">SEND</button>
    </div>

    <div class="chat-box" id="output">Sweety response will appear here...</div>
</div>

<script>
    let synth = window.speechSynthesis;

    window.onload = function() {
        const savedKey = localStorage.getItem("sweety_gemini_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
        }
    };

    function saveApiKey() {
        const key = document.getElementById("apiKey").value.trim();
        localStorage.setItem("sweety_gemini_key", key);
    }

    function setAvatarState(state, statusMsg) {
        document.getElementById("avatarContainer").className = "avatar-container " + state;
        document.getElementById("status").innerText = statusMsg;
    }

    function startSpeech() {
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
            alert("Speech recognition not supported!");
            return;
        }
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRecognition();
        rec.lang = 'en-US';
        
        rec.onstart = () => setAvatarState('listening', 'STATUS: LISTENING...');
        rec.onresult = (e) => {
            document.getElementById("prompt").value = e.results[0][0].transcript;
            setAvatarState('normal', 'STATUS: READY');
            askSweety();
        };
        rec.onerror = () => setAvatarState('normal', 'STATUS: MIC ERROR');
        rec.start();
    }

    async function askSweety() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const prompt = document.getElementById("prompt").value.trim();
        const output = document.getElementById("output");

        if (!apiKey) { alert("API Key Enter Chei Mawa!"); return; }
        if (!prompt) { alert("Message Type or Speak Chei!"); return; }

        setAvatarState('thinking', 'STATUS: SWEETY IS THINKING...');
        output.innerText = "Processing...";

        try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "You are Sweety, a smart friendly AI assistant. Answer briefly in a warm, friendly tone: " + prompt }] }]
                })
            });

            const data = await res.json();
            
            if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                output.innerText = reply;
                speakReply(reply);
            } else if (data.error) {
                output.innerText = "Error: " + data.error.message;
                setAvatarState('normal', 'STATUS: API ERROR');
            } else {
                output.innerText = "Error: Unable to fetch response.";
                setAvatarState('normal', 'STATUS: API ERROR');
            }
        } catch (e) {
            output.innerText = "Connection Error! Check internet or API key.";
            setAvatarState('normal', 'STATUS: OFFLINE');
        }
    }

    function speakReply(text) {
        synth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.onstart = () => setAvatarState('speaking', 'STATUS: SWEETY SPEAKING...');
        utterance.onend = () => setAvatarState('normal', 'STATUS: READY');
        synth.speak(utterance);
    }
</script>

</body>
</html>
