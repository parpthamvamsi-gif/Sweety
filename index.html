<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweety AI Assistant</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1a1a24;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(255, 0, 127, 0.2);
            border: 1px solid #ff007f;
            text-align: center;
        }
        h2 {
            color: #ff007f;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .status {
            font-size: 14px;
            color: #00ffcc;
            margin-bottom: 20px;
        }
        input[type="password"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f12;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            height: 90px;
            resize: none;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 14px;
            background: #ff007f;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button.mic-btn {
            background: #0088ff;
        }
        button.mic-active {
            background: #ff0055;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
        .response-box {
            margin-top: 15px;
            padding: 15px;
            background: #0f0f12;
            border-radius: 8px;
            border-left: 4px solid #ff007f;
            text-align: left;
            min-height: 50px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>S.W.E.E.T.Y AI</h2>
    <div class="status" id="status">Status: Ready</div>

    <input type="password" id="apiKey" placeholder="Enter Gemini API Key Here...">
    
    <textarea id="prompt" placeholder="Type or click Mic to talk..."></textarea>
    
    <div class="btn-group">
        <button id="micBtn" class="mic-btn" onclick="toggleListening()">🎤 SPEAK</button>
        <button onclick="askSweety()">SEND</button>
    </div>

    <div class="response-box" id="output">Sweety response will appear here...</div>
</div>

<script>
    let recognition;
    let isListening = false;

    // Speech Recognition Setup
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById("prompt").value = transcript;
            stopListening();
            askSweety(); // Auto-send when voice input completes
        };

        recognition.onerror = function() {
            stopListening();
            document.getElementById("status").innerText = "Status: Mic Error";
        };

        recognition.onend = function() {
            stopListening();
        };
    }

    function toggleListening() {
        if (!recognition) {
            alert("Speech Recognition not supported in this browser.");
            return;
        }
        if (isListening) {
            stopListening();
        } else {
            startListening();
        }
    }

    function startListening() {
        isListening = true;
        const micBtn = document.getElementById("micBtn");
        micBtn.classList.add("mic-active");
        micBtn.innerText = "🛑 LISTENING...";
        document.getElementById("status").innerText = "Status: Listening to you...";
        recognition.start();
    }

    function stopListening() {
        isListening = false;
        const micBtn = document.getElementById("micBtn");
        micBtn.classList.remove("mic-active");
        micBtn.innerText = "🎤 SPEAK";
        document.getElementById("status").innerText = "Status: Ready";
    }

    // Speech Synthesis
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1.0;
            utterance.pitch = 1.2;
            window.speechSynthesis.speak(utterance);
        }
    }

    async function askSweety() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const prompt = document.getElementById("prompt").value.trim();
        const statusEl = document.getElementById("status");
        const outputEl = document.getElementById("output");

        if (!apiKey) {
            alert("Please enter your Gemini API Key!");
            return;
        }
        if (!prompt) {
            alert("Please type or speak a message!");
            return;
        }

        statusEl.innerText = "Status: Sweety is Thinking...";
        statusEl.style.color = "#ffcc00";
        outputEl.innerText = "Processing...";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: "You are Sweety, a friendly AI assistant. Give short, engaging responses: " + prompt }]
                    }]
                })
            });

            const data = await response.json();

            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const aiReply = data.candidates[0].content.parts[0].text;
                outputEl.innerText = aiReply;
                statusEl.innerText = "Status: Sweety Speaking...";
                statusEl.style.color = "#00ffcc";
                speakText(aiReply);
            } else {
                outputEl.innerText = "Error: Invalid API key or model response.";
                statusEl.innerText = "Status: Error";
            }
        } catch (error) {
            outputEl.innerText = "Connection Error: " + error.message;
            statusEl.innerText = "Status: Offline";
        }
    }
</script>

</body>
</html>
